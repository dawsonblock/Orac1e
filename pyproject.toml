[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-integration"
version = "0.1.0"
description = "Oracle Build v5 — integration layer and control-plane services"
requires-python = ">=3.11"
# Runtime deps are managed via requirements.txt; leave this empty so
# `pip install -e .` only registers the package on sys.path without
# pulling in transitive deps that may conflict with third-party vendored libs.
dependencies = []

[project.scripts]
oracle-preflight   = "integration.preflight:check_all"
oracle-run-server  = "scripts.serve_coding_runs:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["integration*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
