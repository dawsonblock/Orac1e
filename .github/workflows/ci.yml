name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q oracle_runtime integration scripts tests
      - name: Run tests
        run: pytest -q tests
      - name: Security policy check
        run: python scripts/security_policy_check.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/*.sh

  vision-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile check
        run: python -m compileall -q third_party/oracle-os/vision-sidecar
      - name: Install test dependencies
        run: pip install pytest
      - name: Vision sidecar smoke tests
        run: pytest -q tests/test_vision_sidecar_smoke.py

  pipeline:
    runs-on: ubuntu-latest
    needs: [python, shell, vision-sidecar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full pipeline test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash scripts/full_pipeline_test.sh
